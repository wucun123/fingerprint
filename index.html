<!DOCTYPE html> <!-- 告诉浏览器这是HTML5网页，必须在第一行 -->
<html lang="zh-CN"> <!-- 整个网页的地皮，语言设为中文 -->
<head> <!-- 网页的后台配置区，不显示在页面上 -->
    <meta charset="UTF-8"> <!-- 设置网页的字符编码为UTF-8，支持中文 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 适配手机端，防止页面变得极小 -->
    <title>我的AI平台</title> <!-- 浏览器标签页上显示的标题 -->
    <link rel="stylesheet" href="style.css"> <!-- 引入外部CSS样式文件 -->
</head>
<body> <!-- 网页的前台显示区，所有用户能看见的内容都在这里 -->
    <header> <!-- 页头区域 -->
        <h1>wucun 的 AI 多模态平台 好麻烦的东西奥对了祝家人们国庆快乐</h1> <!-- 最大的一级标题 -->
    </header>

    <main> <!-- 网页的核心内容区 -->
        <section id="about"> <!-- 一个内容块，id是它的唯一名字 -->
            <h2>关于我</h2> <!-- 二级标题 -->
            <p>作为一个复杂的项目，其实跨了 AI、数学、软硬件和编程。</p> <!-- 段落文字 -->
        </section>
        
        <section id="skills">
            <h2>我的技能</h2>
            <p>HTML, CSS, JavaScript 入门中...</p>
        </section>
    </main>

    <footer> <!-- 页脚区域 -->
        <p> 2026 wucun. 保留所有权利。</p>
    </footer>

    <script src="script.js"></script> <!-- 引入外部JS文件，放在最下面保证页面加载完再执行 -->
</body>
</html>
